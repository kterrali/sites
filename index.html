<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sky Hopper</title>
  <style>
    :root {
      --panel: rgba(10, 22, 44, 0.76);
      --accent: #ffd54a;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at top, #52c7f1, #1c78bf);
      font-family: Arial, Helvetica, sans-serif;
    }

    #game-wrap {
      position: relative;
      width: min(92vw, 420px);
      aspect-ratio: 9 / 16;
      max-height: 90vh;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
      background: #75d6f7;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: var(--text);
    }

    #score {
      position: absolute;
      top: 28px;
      width: 100%;
      text-align: center;
      font-size: clamp(34px, 9vw, 54px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
    }

    #best {
      position: absolute;
      top: 92px;
      width: 100%;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.28));
      transition: opacity 0.2s ease;
    }

    #card {
      width: min(100%, 325px);
      padding: 26px 22px;
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: 20px;
      text-align: center;
      color: white;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
    }

    #card h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 34px;
      letter-spacing: 0.4px;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
    }

    #card p {
      margin: 8px 0;
      line-height: 1.45;
      font-size: 15px;
    }

    #card .result {
      display: none;
      margin: 18px 0;
      padding: 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      color: #18223d;
      background: var(--accent);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #ce9f10;
      transition: transform 0.08s ease;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #ce9f10;
    }

    .hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    #hint {
      position: absolute;
      bottom: 22px;
      width: 100%;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 2px 1px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="game-wrap">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div id="score">0</div>
      <div id="best">Meilleur score : 0</div>
      <div id="hint">ESPACE / CLIC / TAP pour voler</div>
    </div>

    <section id="overlay">
      <div id="card">
        <h1 id="title">Sky Hopper</h1>
        <p id="description">
          Traverse les tuyaux sans les toucher.<br />
          Appuie sur <strong>Espace</strong>, clique ou touche l’écran.
        </p>

        <div class="result" id="result"></div>

        <button id="playButton">JOUER</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const wrap = document.getElementById("game-wrap");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const playButton = document.getElementById("playButton");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    const W = 420;
    const H = 700;
    canvas.width = W;
    canvas.height = H;

    let bestScore = Number(localStorage.getItem("skyHopperBest") || 0);
    let score = 0;
    let gameRunning = false;
    let gameStarted = false;
    let animationId = null;
    let lastTime = 0;
    let elapsed = 0;

    const bird = {
      x: 105,
      y: H / 2,
      radius: 17,
      velocity: 0,
      rotation: 0
    };

    const pipes = [];

    const settings = {
      gravity: 0.38,
      flapPower: -6.7,
      pipeWidth: 66,
      pipeGap: 165,
      pipeSpeed: 2.6,
      spawnEvery: 1500,
      groundHeight: 90
    };

    function updateBest() {
      bestElement.textContent = `Meilleur score : ${bestScore}`;
    }

    function resetGame() {
      score = 0;
      elapsed = 0;
      pipes.length = 0;

      bird.y = H / 2;
      bird.velocity = 0;
      bird.rotation = 0;

      scoreElement.textContent = score;
      updateBest();
    }

    function startGame() {
      cancelAnimationFrame(animationId);

      resetGame();
      gameRunning = true;
      gameStarted = true;
      lastTime = performance.now();

      overlay.classList.add("hidden");
      hint.style.display = "block";

      flap();
      animationId = requestAnimationFrame(loop);
    }

    function flap() {
      if (!gameRunning) return;
      bird.velocity = settings.flapPower;
    }

    function gameOver() {
      if (!gameRunning) return;

      gameRunning = false;
      cancelAnimationFrame(animationId);

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("skyHopperBest", bestScore);
      }

      updateBest();
      hint.style.display = "none";

      title.textContent = "Partie terminée";
      description.textContent = score === 0
        ? "Presque ! Essaie de garder un rythme régulier."
        : "Bien joué ! Tu peux faire encore mieux.";

      result.style.display = "block";
      result.innerHTML = `
        Score : <strong>${score}</strong><br>
        Meilleur score : <strong>${bestScore}</strong>
      `;

      playButton.textContent = "REJOUER";
      overlay.classList.remove("hidden");
    }

    function spawnPipe() {
      const minTop = 85;
      const maxTop = H - settings.groundHeight - settings.pipeGap - 85;
      const gapY = Math.random() * (maxTop - minTop) + minTop;

      pipes.push({
        x: W + 20,
        topHeight: gapY,
        bottomY: gapY + settings.pipeGap,
        counted: false
      });
    }

    function update(delta) {
      const factor = delta / 16.67;

      bird.velocity += settings.gravity * factor;
      bird.y += bird.velocity * factor;
      bird.rotation = Math.max(-0.45, Math.min(1.1, bird.velocity * 0.08));

      elapsed += delta;

      if (elapsed >= settings.spawnEvery) {
        spawnPipe();
        elapsed = 0;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const pipe = pipes[i];
        pipe.x -= settings.pipeSpeed * factor;

        if (!pipe.counted && pipe.x + settings.pipeWidth < bird.x) {
          pipe.counted = true;
          score++;
          scoreElement.textContent = score;
        }

        if (pipe.x + settings.pipeWidth < -20) {
          pipes.splice(i, 1);
        }
      }

      const birdLeft = bird.x - bird.radius;
      const birdRight = bird.x + bird.radius;
      const birdTop = bird.y - bird.radius;
      const birdBottom = bird.y + bird.radius;

      if (birdTop < 0 || birdBottom > H - settings.groundHeight) {
        gameOver();
        return;
      }

      for (const pipe of pipes) {
        const horizontalCollision =
          birdRight > pipe.x &&
          birdLeft < pipe.x + settings.pipeWidth;

        const verticalCollision =
          birdTop < pipe.topHeight ||
          birdBottom > pipe.bottomY;

        if (horizontalCollision && verticalCollision) {
          gameOver();
          return;
        }
      }
    }

    function drawCloud(x, y, scale = 1) {
      ctx.fillStyle = "rgba(255,255,255,0.78)";
      ctx.beginPath();
      ctx.arc(x, y, 18 * scale, 0, Math.PI * 2);
      ctx.arc(x + 23 * scale, y - 10 * scale, 24 * scale, 0, Math.PI * 2);
      ctx.arc(x + 50 * scale, y, 17 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#63d4f5");
      sky.addColorStop(1, "#c6f5ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      drawCloud(50, 125, 0.85);
      drawCloud(280, 210, 0.65);
      drawCloud(190, 390, 0.48);

      ctx.fillStyle = "#7acb59";
      ctx.fillRect(0, H - settings.groundHeight - 12, W, 12);

      ctx.fillStyle = "#d9a44a";
      ctx.fillRect(0, H - settings.groundHeight, W, settings.groundHeight);

      ctx.fillStyle = "#c48b39";
      for (let x = -20; x < W + 20; x += 28) {
        ctx.fillRect(x, H - 38, 16, 5);
        ctx.fillRect(x + 8, H - 19, 16, 5);
      }
    }

    function drawPipe(pipe) {
      const width = settings.pipeWidth;
      const capHeight = 22;

      ctx.fillStyle = "#278c42";
      ctx.fillRect(pipe.x, 0, width, pipe.topHeight);
      ctx.fillRect(pipe.x, pipe.bottomY, width, H - settings.groundHeight - pipe.bottomY);

      ctx.fillStyle = "#39af54";
      ctx.fillRect(pipe.x + 7, 0, 14, pipe.topHeight);
      ctx.fillRect(pipe.x + 7, pipe.bottomY, 14, H - settings.groundHeight - pipe.bottomY);

      ctx.fillStyle = "#1d6f34";
      ctx.fillRect(pipe.x + width - 8, 0, 8, pipe.topHeight);
      ctx.fillRect(
        pipe.x + width - 8,
        pipe.bottomY,
        8,
        H - settings.groundHeight - pipe.bottomY
      );

      ctx.fillStyle = "#2d9e49";
      ctx.fillRect(pipe.x - 5, pipe.topHeight - capHeight, width + 10, capHeight);
      ctx.fillRect(pipe.x - 5, pipe.bottomY, width + 10, capHeight);

      ctx.fillStyle = "#17632f";
      ctx.fillRect(pipe.x - 5, pipe.topHeight - 5, width + 10, 5);
      ctx.fillRect(pipe.x - 5, pipe.bottomY + capHeight - 5, width + 10, 5);
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      ctx.fillStyle = "#f4ae22";
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 17, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f8c53c";
      ctx.beginPath();
      ctx.ellipse(-5, 8, 15, 10, -0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ec7f1c";
      ctx.beginPath();
      ctx.moveTo(-19, -2);
      ctx.lineTo(-34, -10);
      ctx.lineTo(-22, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(8, -7, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(10, -7, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f26d21";
      ctx.beginPath();
      ctx.moveTo(20, 2);
      ctx.lineTo(34, 7);
      ctx.lineTo(20, 12);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      drawBackground();

      for (const pipe of pipes) {
        drawPipe(pipe);
      }

      drawBird();
    }

    function loop(timestamp) {
      if (!gameRunning) return;

      const delta = Math.min(timestamp - lastTime, 40);
      lastTime = timestamp;

      update(delta);
      draw();

      if (gameRunning) {
        animationId = requestAnimationFrame(loop);
      }
    }

    function handleInput(event) {
      if (event) event.preventDefault();

      if (!gameRunning) {
        if (!overlay.classList.contains("hidden")) {
          startGame();
        }
        return;
      }

      flap();
    }

    playButton.addEventListener("click", (event) => {
      event.stopPropagation();
      startGame();
    });

    canvas.addEventListener("pointerdown", handleInput);

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        handleInput(event);
      }
    });

    updateBest();
    draw();
  </script>
</body>
</html>
